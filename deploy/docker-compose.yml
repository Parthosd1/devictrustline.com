# Single-server production stack: HTTPS (Caddy), the app, PostgreSQL and nightly backups.
#   cp deploy/.env.example deploy/.env   # then fill it in
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
services:
  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy

  app:
    build: ..
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://devicetrustline:${POSTGRES_PASSWORD}@db:5432/devicetrustline
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in deploy/.env}
      APP_ORIGIN: https://${DOMAIN}
      TRUST_PROXY: "true"
      ALLOW_SIGNUP: ${ALLOW_SIGNUP:-false}
      SESSION_HOURS: ${SESSION_HOURS:-8}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: devicetrustline
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: devicetrustline
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devicetrustline"]
      interval: 5s
      retries: 10

  # Nightly compressed pg_dump into ./backups, keeping the last BACKUP_KEEP_DAYS days.
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGHOST: db
      PGUSER: devicetrustline
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: devicetrustline
      KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./backups:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          f=/backups/devicetrustline-$$(date -u +%Y%m%d-%H%M%S).sql.gz
          if pg_dump --no-owner | gzip > "$$f.tmp"; then mv "$$f.tmp" "$$f"; echo "backup written $$f"; else rm -f "$$f.tmp"; echo "backup FAILED"; fi
          find /backups -name 'devicetrustline-*.sql.gz' -mtime +$$KEEP_DAYS -delete
          sleep 86400
        done
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  caddy_data:
  caddy_config:
