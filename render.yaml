# Render Blueprint: one web service (app + API) and a managed PostgreSQL database.
# In Render: New > Blueprint > pick this repository. Then set APP_ORIGIN and APP_URL to your URL.
services:
  - type: web
    name: devicetrustline
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: devicetrustline-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: TRUST_PROXY
        value: "true"
      - key: APP_ORIGIN
        sync: false
      - key: APP_URL
        sync: false
      - key: ALLOW_SIGNUP
        value: "false"
      - key: SMTP_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      - key: SMS_PROVIDER
        value: disabled
    # Uploaded photos and documents. A disk pins the service to one instance.
    disk:
      name: data
      mountPath: /data
      sizeGB: 5

databases:
  - name: devicetrustline-db
    plan: basic-256mb
    postgresVersion: "16"
